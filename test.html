const WGSL = /* wgsl */`
struct U { a:vec4f, b:vec4f, c:vec4f, d:vec4f, e:vec4f };
@group(0) @binding(0) var<uniform> u : U;
@group(0) @binding(1) var<uniform> P : array<vec4f,128>;

fn hash2(x:i32, z:i32) -> u32 {
  var h = bitcast<u32>(x)*374761393u + bitcast<u32>(z)*668265263u;
  h = (h ^ (h >> 13u)) * 1274126177u;
  return h ^ (h >> 16u);
}
fn h3(a:i32,b:i32,c:i32) -> f32 { return f32(hash2(a + c*1013, b*7 + c) & 255u) / 255.0; }
fn lat(x:i32,z:i32) -> f32 { return f32(hash2(x,z) & 255u) / 255.0; }
fn vnoise(p:vec2f) -> f32 {
  let i = floor(p); let f = fract(p); let s = f*f*(3.0-2.0*f);
  let ix = i32(i.x); let iz = i32(i.y);
  return mix(mix(lat(ix,iz),lat(ix+1,iz),s.x), mix(lat(ix,iz+1),lat(ix+1,iz+1),s.x), s.y);
}
fn height(x:i32, z:i32) -> i32 {
  let p = vec2f(f32(x)+0.5, f32(z)+0.5);
  return i32(floor(3.0 + vnoise(p/18.0)*7.0 + vnoise(p/7.0)*3.0));
}

struct Hit { hit:bool, t:f32, c:vec3i, n:vec3f };

fn traceVox(ro:vec3f, rd:vec3f, maxSteps:i32) -> Hit {
  var h : Hit; h.hit = false; h.t = 1e9; h.n = vec3f(0,1,0);
  var c = vec3i(floor(ro));
  let stp = select(vec3i(-1), vec3i(1), rd >= vec3f(0.0));
  let srd = rd + select(vec3f(0.0), vec3f(1e-7), abs(rd) < vec3f(1e-7));
  let bnd = select(floor(ro), floor(ro)+1.0, rd >= vec3f(0.0));
  var tMax = (bnd - ro) / srd;
  let tD = abs(1.0/srd);
  var t = 0.0; var n = vec3f(0,1,0);
  for (var i=0; i<maxSteps; i++) {
    if (c.y <= height(c.x, c.z)) { h.hit = true; h.t = t; h.c = c; h.n = n; return h; }
    if (c.y > 14 && rd.y > 0.0) { break; }
    if (tMax.x < tMax.y && tMax.x < tMax.z) { t = tMax.x; tMax.x += tD.x; c.x += stp.x; n = vec3f(-f32(stp.x),0,0); }
    else if (tMax.y < tMax.z) { t = tMax.y; tMax.y += tD.y; c.y += stp.y; n = vec3f(0,-f32(stp.y),0); }
    else { t = tMax.z; tMax.z += tD.z; c.z += stp.z; n = vec3f(0,0,-f32(stp.z)); }
  }
  return h;
}

fn box(ro:vec3f, rd:vec3f, bmin:vec3f, bmax:vec3f) -> vec4f {
  let r = 1.0 / (rd + select(vec3f(0.0), vec3f(1e-7), abs(rd) < vec3f(1e-7)));
  let t1 = (bmin-ro)*r; let t2 = (bmax-ro)*r;
  let tmin = min(t1,t2); let tmax = max(t1,t2);
  let tn = max(max(tmin.x,tmin.y),tmin.z); let tf = min(min(tmax.x,tmax.y),tmax.z);
  if (tn > tf || tf < 0.0) { return vec4f(-1.0,0,0,0); }
  let n = -sign(rd) * step(tmin.yzx, tmin.xyz) * step(tmin.zxy, tmin.xyz);
  return vec4f(tn, n);
}

var<private> pmin = array<vec3f,6>(
  vec3f(-0.28,0.0,-0.13), vec3f(0.02,0.0,-0.13), vec3f(-0.28,0.7,-0.15),
  vec3f(-0.52,1.05,-0.1), vec3f(0.28,1.05,-0.1), vec3f(-0.25,1.35,-0.25));
var<private> pmax = array<vec3f,6>(
  vec3f(-0.02,0.7,0.13), vec3f(0.28,0.7,0.13), vec3f(0.28,1.35,0.15),
  vec3f(-0.28,1.3,0.75), vec3f(0.52,1.3,0.75), vec3f(0.25,1.85,0.25));
var<private> pcol = array<vec3f,6>(
  vec3f(0.14,0.2,0.45), vec3f(0.14,0.2,0.45), vec3f(0.2,0.4,0.62),
  vec3f(0.22,0.5,0.24), vec3f(0.22,0.5,0.24), vec3f(0.25,0.55,0.26));

fn zinfo(i:u32, t:f32) -> vec4f {
  let fi = f32(i);
  let a = t*0.15 + fi*1.7;
  let c = vec2f(fi*9.0 - 14.0 + sin(a)*7.0, 8.0 + fi*4.0 + cos(a*1.3)*6.0);
  let d = vec2f(cos(a)*7.0, -sin(a*1.3)*6.0*1.3);
  let y = f32(height(i32(floor(c.x)), i32(floor(c.y)))) + 1.0;
  return vec4f(c.x, y, c.y, atan2(d.x, d.y));
}

struct Z { t:f32, n:vec3f, col:vec3f, em:f32 };

fn zombies(ro:vec3f, rd:vec3f, time:f32) -> Z {
  var best : Z; best.t = 1e9; best.n = vec3f(0,1,0); best.col = vec3f(0); best.em = 0.0;
  for (var i=0u; i<4u; i++) {
    let bs = P[96u+i];
    let oc = ro - bs.xyz; let b = dot(oc,rd); let cc = dot(oc,oc) - bs.w*bs.w;
    if ((b > 0.0 && cc > 0.0) || (b*b - cc < 0.0)) { continue; }
    for (var k=0u; k<6u; k++) {
      let j = (i*6u + k)*4u;
      let c = P[j]; let X = P[j+1u]; let Y = P[j+2u]; let Zv = P[j+3u];
      let d = ro - c.xyz;
      let lro = vec3f(dot(d,X.xyz), dot(d,Y.xyz), dot(d,Zv.xyz));
      let lrd = vec3f(dot(rd,X.xyz), dot(rd,Y.xyz), dot(rd,Zv.xyz));
      let hs = vec3f(X.w, Y.w, Zv.w);
      let r = box(lro, lrd, -hs, hs);
      if (r.x > 0.0 && r.x < best.t) {
        best.t = r.x; let ln = r.yzw; let lp = lro + lrd*r.x;
        best.n = X.xyz*ln.x + Y.xyz*ln.y + Zv.xyz*ln.z;
        let q = vec3i(floor(lp*8.0));
        let tex = h3(q.x + i32(i)*57, q.y, q.z);
        let ty = u32(c.w);
        best.col = pcol[ty] * (0.75 + 0.5*tex); best.em = 0.0;
        if (ty == 5u && ln.z > 0.5 && lp.y > 0.02 && lp.y < 0.14 && abs(lp.x) > 0.07 && abs(lp.x) < 0.19) { best.em = 1.0; }
      }
    }
  }
  return best;
}
fn zombiesOld(ro:vec3f, rd:vec3f, time:f32) -> Z {
  var best : Z; best.t = 1e9; best.n = vec3f(0,1,0); best.col = vec3f(0); best.em = 0.0;
  for (var i=0u; i<4u; i++) {
    let zi = zinfo(i, time);
    let c = zi.xyz; let cs = cos(zi.w); let sn = sin(zi.w);
    let d = ro - c;
    let oc = d - vec3f(0,0.9,0); let b = dot(oc,rd); let cc = dot(oc,oc) - 1.96;
    if ((b > 0.0 && cc > 0.0) || (b*b - cc < 0.0)) { continue; }
    let lro = vec3f(d.x*cs - d.z*sn, d.y, d.x*sn + d.z*cs);
    let lrd = vec3f(rd.x*cs - rd.z*sn, rd.y, rd.x*sn + rd.z*cs);
    for (var k=0; k<6; k++) {
      let r = box(lro, lrd, pmin[k], pmax[k]);
      if (r.x > 0.0 && r.x < best.t) {
        best.t = r.x;
        let ln = r.yzw; let lp = lro + lrd*r.x;
        best.n = vec3f(ln.x*cs + ln.z*sn, ln.y, -ln.x*sn + ln.z*cs);
        let q = vec3i(floor(lp*8.0));
        let tex = h3(q.x + i32(i)*57, q.y, q.z);
        best.col = pcol[k] * (0.75 + 0.5*tex);
        best.em = 0.0;
        if (k == 5 && ln.z > 0.5 && lp.y > 1.6 && lp.y < 1.72 && abs(lp.x) > 0.07 && abs(lp.x) < 0.19) { best.em = 1.0; }
      }

const L = vec3f(-0.55, 0.62, -0.56);

fn sky(rd:vec3f) -> vec3f {
  var c = mix(vec3f(0.02,0.03,0.07), vec3f(0.01,0.015,0.04), clamp(rd.y*1.5,0.0,1.0));
  let q = vec3i(floor(rd*170.0));
  if ((hash2(q.x*13 + q.z*7, q.y*31 + q.z) & 1023u) < 3u && rd.y > 0.0) { c += vec3f(0.6,0.65,0.8); }
  let m = dot(rd, normalize(L));
  if (m > 0.9988) { c = vec3f(0.85,0.88,0.95); }
  c += vec3f(0.12,0.14,0.2) * smoothstep(0.985, 1.0, m) * 0.6;
  return c;
}

fn bayer8(p:vec2u) -> f32 {
  let x = p.x & 7u; let y = p.y & 7u; let a = x ^ y;
  let idx = ((a&1u)<<5u)|((y&1u)<<4u)|((a&2u)<<2u)|((y&2u)<<1u)|((a&4u)>>1u)|((y&4u)>>2u);
  return (f32(idx) + 0.5) / 64.0;
}

@vertex fn vs(@builtin(vertex_index) i:u32) -> @builtin(position) vec4f {
  let p = vec2f(f32((i<<1u)&2u), f32(i&2u));
  return vec4f(p*2.0-1.0, 0.0, 1.0);
}

fn lcol(i:u32) -> vec3f {
  if (i == 0u) { return vec3f(1.0,0.2,0.12); }
  if (i == 1u) { return vec3f(0.15,0.9,1.0); }
  if (i == 2u) { return vec3f(0.85,0.25,1.0); }
  if (i == 3u) { return vec3f(1.0,0.55,0.1); }
  if (i == 4u) { return vec3f(0.3,1.0,0.3); }
  return vec3f(1.0,0.95,0.6);
}
fn lcolOld(i:u32) -> vec3f {
  if (i == 0u) { return vec3f(1.0,0.2,0.12); }
  if (i == 1u) { return vec3f(0.15,0.9,1.0); }
  return vec3f(0.85,0.25,1.0);
}
fn lightPos(i:u32, t:f32) -> vec3f { return P[104u+i].xyz; }
fn cubeC(i:u32, t:f32) -> vec4f {
  var c = vec4f(-7.0, 16.0, 18.0, 1.1);
  if (i == 1u) { c = vec4f(7.0, 17.5, 26.0, 1.4); }
  if (i == 2u) { c = vec4f(0.0, 15.5, 34.0, 1.8); }
  c.y += sin(t*0.8 + f32(i)*2.0) * 0.6;
  return c;
}
fn cubeM(i:u32, t:f32) -> mat3x3f {
  let a = t*0.5 + f32(i)*1.3; let b = 0.6 + 0.25*f32(i);
  let ca = cos(a); let sa = sin(a); let cb = cos(b); let sb = sin(b);
  let ry = mat3x3f(vec3f(ca,0,-sa), vec3f(0,1,0), vec3f(sa,0,ca));
  let rx = mat3x3f(vec3f(1,0,0), vec3f(0,cb,sb), vec3f(0,-sb,cb));
  return ry * rx;
}
fn lightPosOld(i:u32, t:f32) -> vec3f {
  let a = t*0.45 + f32(i)*2.094;
  let xz = vec2f(sin(a)*8.0, 10.0 + cos(a)*7.0);
  let y = f32(height(i32(floor(xz.x)), i32(floor(xz.y)))) + 2.2 + sin(t*2.0 + f32(i))*0.4;
  return vec3f(xz.x, y, xz.y);
}
fn pl(p:vec3f, n:vec3f) -> vec3f {
  var c = vec3f(0.0); let t = u.a.w;
  for (var i=0u; i<6u; i++) {
    let d = lightPos(i,t) - p; let d2 = dot(d,d);
    c += lcol(i) * max(dot(n, d*inverseSqrt(d2)), 0.0) * 6.0 / (1.0 + 0.35*d2);

fn sph(i:u32, t:f32) -> vec4f { return P[112u+i]; }
fn sphOld(i:u32, t:f32) -> vec4f {
  var c = vec3f(4.0,0.0,8.0); var r = 1.3;
  if (i == 1u) { c = vec3f(-3.5,0.0,11.5); r = 1.0; }
  if (i == 2u) { c = vec3f(0.5,0.0,15.5); r = 1.7; }
  var m = 0;
  for (var dx=-1; dx<=1; dx++) { for (var dz=-1; dz<=1; dz++) { m = max(m, height(i32(floor(c.x))+dx, i32(floor(c.z))+dz)); } }
  c.y = f32(m) + 1.0 + r + 0.15*sin(t*1.5 + f32(i));
  return vec4f(c, r);

fn isph(ro:vec3f, rd:vec3f, c:vec3f, r:f32) -> f32 {
  let oc = ro - c; let b = dot(oc,rd); let h = b*b - (dot(oc,oc) - r*r);
  if (h < 0.0) { return -1.0; }
  let t = -b - sqrt(h);
  if (t > 0.001) { return t; }
  return -1.0;
}

struct S { col:vec3f, dist:f32, refl:f32, tint:vec3f, p:vec3f, n:vec3f };

fn scene(ro:vec3f, rd:vec3f) -> S {
  let time = u.a.w; let flick = u.e.z;
  var out : S; out.refl = 0.0; out.tint = vec3f(1.0); out.n = vec3f(0,1,0);
  let th = traceVox(ro, rd, 110);
  let tz = zombies(ro, rd, time);
  var col : vec3f; var dist = 60.0;
  let ambient = vec3f(0.07,0.10,0.19);
  let moonCol = vec3f(0.42,0.52,0.85);
  let torchCol = vec3f(1.0,0.72,0.38) * flick;

    let sp = sph(i, time);
    let t1 = isph(ro, rd, sp.xyz, sp.w);
    if (t1 > 0.0 && t1 < ts) { ts = t1; si = i32(i); }
    let t2 = isph(ro, rd, lightPos(i, time), 0.28);
    if (t2 > 0.0 && t2 < to) { to = t2; oi = i32(i); }
  }
  var tcb = 1e9; var ci = -1; var cnw = vec3f(0.0); var cln = vec3f(0.0);
  for (var i=0u; i<3u; i++) {
    let cc = cubeC(i, time); let M = cubeM(i, time);
    let r = box((ro - cc.xyz) * M, rd * M, vec3f(-cc.w), vec3f(cc.w));
    if (r.x > 0.0 && r.x < tcb) { tcb = r.x; ci = i32(i); cln = r.yzw; cnw = M * r.yzw; }

    let cc = cubeC(u32(ci), time); let M = cubeM(u32(ci), time);

    return out;
  }
  if (si >= 0 && ts < tw) {
    let sp = sph(u32(si), time);
    let p = ro + rd*ts; var n = normalize(p - sp.xyz);
    var refl = 0.85; var tint = vec3f(0.95,0.97,1.0); var rough = 0.10;
    if (si == 1) { refl = 0.72; tint = vec3f(1.0,0.78,0.35); rough = 0.22; }
    if (si == 2) { refl = 0.6; tint = vec3f(0.45,0.7,1.0); rough = 0.35; }
    if (si == 3) { refl = 0.7; tint = vec3f(1.0,0.5,0.3); rough = 0.30; }
    if (si == 4) { refl = 0.55; tint = vec3f(0.3,1.0,0.55); rough = 0.18; }
    if (si == 5) { refl = 0.35; tint = vec3f(0.6,0.6,0.85); rough = 0.08; }
    let gn = n;
    let sq = P[120u+u32(si)];
    let off = p - sp.xyz;
    let loc = off + 2.0*sq.w*cross(-sq.xyz, off) + 2.0*cross(-sq.xyz, cross(-sq.xyz, off));
    let lq = vec3i(floor(loc*(5.0/sp.w) + 64.0));
    let jn = vec3f(h3(lq.x,lq.y,lq.z), h3(lq.y,lq.z,lq.x+5), h3(lq.z,lq.x,lq.y+9)) - 0.5;
    let jw = jn + 2.0*sq.w*cross(sq.xyz, jn) + 2.0*cross(sq.xyz, cross(sq.xyz, jn));
    n = normalize(n + jw*rough*2.2);
    let lr = loc / sp.w;
    if (abs(lr.y) < 0.12 || (abs(lr.x) < 0.07 && lr.z > 0.0)) { tint = vec3f(0.85,0.2,0.12); refl *= 0.45; }

    refl = mix(refl, 1.0, pow(1.0 - max(dot(-rd, n), 0.0), 4.0)*0.5);
    let rr = reflect(rd, n);
    var spec = pow(max(dot(rr, normalize(L)), 0.0), 80.0) * moonCol * 3.0;
    for (var i=0u; i<6u; i++) {

      spec += lcol(i) * pow(max(dot(rr, l), 0.0), 60.0) * 2.0;

    out.col = tint * (1.0 - refl) * (vec3f(0.07,0.1,0.19) + pl(p, n)) + spec;

    const dt=Math.min(0.05,(now-last)/1000);last=now;
    // look (arrow keys + smoothing)
    if(keys.ArrowLeft)tyaw-=1.8*dt;if(keys.ArrowRight)tyaw+=1.8*dt;
    if(keys.ArrowUp)tpitch=Math.min(1.5,tpitch+1.3*dt);if(keys.ArrowDown)tpitch=Math.max(-1.5,tpitch-1.3*dt);
    const ls=1-Math.exp(-dt*22);yaw+=(tyaw-yaw)*ls;pitch+=(tpitch-pitch)*ls;
    // move with acceleration
    const sy=Math.sin(yaw),cy=Math.cos(yaw);
    let mx=(keys.KeyD?1:0)-(keys.KeyA?1:0),mz=(keys.KeyW?1:0)-(keys.KeyS?1:0);
    const ml=Math.hypot(mx,mz)||1;mx/=ml;mz/=ml;
    const sp=keys.ShiftLeft||keys.ShiftRight?9:5;
    const tvx=(sy*mz+cy*mx)*sp,tvz=(cy*mz-sy*mx)*sp;
    const k=1-Math.exp(-dt*(grounded?9:2.5));
    vx+=(tvx-vx)*k;vz+=(tvz-vz)*k;
    if(keys.Space&&grounded){vy=9;grounded=false;}
    vy-=28*dt;
    let nx=px+vx*dt;if(H(Math.floor(nx),Math.floor(pz))+1<=py+1.05)px=nx;else vx=0;
    let nz=pz+vz*dt;if(H(Math.floor(px),Math.floor(nz))+1<=py+1.05)pz=nz;else vz=0;
    py+=vy*dt;
    const gh=H(Math.floor(px),Math.floor(pz))+1;
    if(py<=gh){py=gh;vy=0;grounded=true;}else if(py>gh+0.05)grounded=false;
    const spd=Math.hypot(vx,vz);
    if(grounded)bob+=spd*dt*2.1;
    const targetEye=py+1.6+Math.sin(bob)*0.05*Math.min(1,spd/5);
    eye+=(targetEye-eye)*(1-Math.exp(-dt*18));
    physUpdate(dt);
    // camera basis
    const cp=Math.cos(pitch),sp2=Math.sin(pitch);
    const t=(now-t0)/1000;
    data.set([px,eye,pz,t, sy*cp,sp2,cy*cp,Math.tan(0.5*1.15), cy,0,-sy,W/Hh, -sy*sp2,cp,-cy*sp2,0, W,Hh,0.9+0.1*Math.sin(t*13)*Math.sin(t*5.3)+0.05*Math.sin(t*31),0]);
    device.queue.writeBuffer(ubuf,0,data);device.queue.writeBuffer(pbuf,0,PD);
    const enc=device.createCommandEncoder();
    const pass=enc.beginRenderPass({colorAttachments:[{view:ctx.getCurrentTexture().createView(),loadOp:'clear',storeOp:'store',clearValue:{r:0,g:0,b:0,a:1}}]});
    pass.setPipeline(pipe);pass.setBindGroup(0,bg);pass.draw(3);pass.end();
    device.queue.submit([enc.finish()]);
    fpsAcc+=dt;fpsN++;if(fpsAcc>0.5){fps=Math.round(fpsN/fpsAcc);fpsAcc=0;fpsN=0;
      hud.textContent='Night Voxels pre alpha\nfps: '+fps+'\nres: '+W+'x'+Hh+'\nxyz: '+px.toFixed(1)+' '+py.toFixed(1)+' '+pz.toFixed(1)+'\nrenderer: webgpu raytracer';}
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
}
main().catch(e=>{document.getElementById('msg').textContent='Error: '+e.message;console.error(e);});
</script>

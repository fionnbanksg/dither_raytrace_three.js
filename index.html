<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Levers and Chests</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; font-family: monospace; color: #fff; }
  #viewport { position: fixed; inset: 0; }
  #view { display: block; width: 100%; height: 100%; image-rendering: pixelated; image-rendering: crisp-edges; cursor: crosshair; }
  #title { position: absolute; top: 8px; left: 10px; font-size: 18px; text-shadow: 1px 1px 0 #000; pointer-events: none; }
  #hint  { position: absolute; bottom: 8px; left: 10px; font-size: 12px; opacity: .6; text-shadow: 1px 1px 0 #000; pointer-events: none; }
  #debug { position: absolute; top: 8px; right: 10px; font-size: 11px; opacity: .6; text-shadow: 1px 1px 0 #000; pointer-events: none; text-align: right; white-space: pre; }
</style>
</head>
<body>
<div id="viewport">
  <canvas id="view"></canvas>
  <div id="title">Levers and Chests pre alpha</div>
  <div id="hint"></div>
  <div id="debug"></div>
</div>

<script type="module" src="./main.js"></script>
</body>
</html>

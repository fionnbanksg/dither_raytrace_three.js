<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>dither-vox</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; font-family: monospace; color: #fff; }
  #viewport { position: fixed; inset: 0; }
  #view { display: block; width: 100%; height: 100%; image-rendering: pixelated; image-rendering: crisp-edges; cursor: crosshair; }
  #crosshair { position: absolute; left: 50%; top: 50%; width: 14px; height: 14px; margin: -7px 0 0 -7px; pointer-events: none; opacity: .75; mix-blend-mode: difference;
    background: linear-gradient(#fff,#fff) center/2px 100% no-repeat, linear-gradient(#fff,#fff) center/100% 2px no-repeat; -webkit-mask: radial-gradient(circle, transparent 2px, #000 3px); mask: radial-gradient(circle, transparent 2px, #000 3px); }
  #hint  { position: absolute; bottom: 8px; left: 10px; font-size: 12px; opacity: .6; text-shadow: 1px 1px 0 #000; pointer-events: none; }
  #debug { display: none; position: absolute; top: 8px; right: 10px; font-size: 11px; line-height: 1.35; opacity: .85; text-shadow: 1px 1px 0 #000; pointer-events: none; text-align: right; }
  #debug.on { display: block; }
  #debug pre { margin: 0; font: inherit; white-space: pre; }
  #debug canvas { display: block; margin: 6px 0 0 auto; image-rendering: pixelated; }
</style>
</head>
<body>
<div id="viewport">
  <canvas id="view"></canvas>
  <div id="crosshair"></div>
  <div id="hint"></div>
  <div id="debug"></div>
</div>

<script type="module" src="./main.js"></script>
</body>
</html>
